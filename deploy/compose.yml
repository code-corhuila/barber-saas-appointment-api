# This service only. barber-saas-infra-postgres includes this file to compose the platform.
services:
  appointment-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8080"
      # The single PostgreSQL instance of barber-saas-infra-postgres, with this domain's own user (Annex J J.7).
      DATABASE_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE}
      DATABASE_USER: appointment_app
      DATABASE_PASSWORD: ${APPOINTMENT_APP_PASSWORD:?set APPOINTMENT_APP_PASSWORD}
      # Only the public half: this service validates tokens, it never signs them.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run barber-saas-infra-postgres/scripts/dev-keys.sh}
      DB_POOL_MAX: "10"
      # The other domains, through their APIs on the platform network (golden rule 8).
      BARBERSHOP_API_URL: http://barbershop-api:8080
      SCHEDULE_API_URL: http://schedule-api:8080
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /health HTTP/1.0\r\n\r\n\" >&3 && grep -q ok <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 512m
    # expose, not ports: only the gateway is reachable from the host.
    expose: ["8080"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
